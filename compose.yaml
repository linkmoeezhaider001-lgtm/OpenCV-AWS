services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-vision-api:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agentic_vision:agentic_vision_password@db:5432/agentic_vision
      API_KEY: ${API_KEY:-local-development-key}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentic_vision
      POSTGRES_USER: agentic_vision
      POSTGRES_PASSWORD: agentic_vision_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentic_vision -d agentic_vision",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
